<!DOCTYPE html>
<!-- ny tråd skjema -->
<!-- NOE AV KODEN HER ER TATT FRA YOUTUBE, MEN TENKTE DET ER GREIT SIDEN DETTE IKKE HAR SÅ MYE MED HTML OG CSS OG GJØRE. -->

<html lang="nb">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
	<meta name="description" content="ny tråd im1a">
	<title>Ny tråd | IM1A-forum</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link rel="stylesheet" href="style.css">
	<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,400&family=DM+Sans:wght@400;500;600&display=optional" rel="stylesheet">
</head>

<body>

	<nav class="navbar" aria-label="Hovedmeny">
		<div class="logo"><a href="index.html">IM1A-forum</a></div>
		<ul class="nav-links">
			<li><a href="index.html">Framsida</a></li>
			<li><a href="om.html">Om nettstedet</a></li>
			<li><a href="bilder.html">Galleri</a></li>
		</ul>
	</nav>

	<main>
		<h1>Ny tråd</h1>
		<div class="tekst-boks skjema-boks skjema-boks--vid">
			<p class="skjema-innføring">
				dette blir bare hos deg i pcen ikke noe skikkelig lagring. innlegg vises som «Anonym» som avsender.
			</p>

			<form id="ny-trad-form" class="skjema" novalidate>
				<div class="skjema-gruppe">
					<label for="tittel">Tittel</label>
					<input type="text" id="tittel" name="tittel" required maxlength="120" autocomplete="off">
				</div>
				<div class="skjema-gruppe">
					<label for="innlegg">Innlegg</label>
					<textarea id="innlegg" name="innlegg" rows="8" required></textarea>
				</div>
				<p id="ny-feil" class="skjema-feil" role="alert" hidden></p>
				<button type="submit" class="knapp knapp--mørk">Publiser tråd</button>
			</form>
		</div>
	</main>

	<footer class="hoved-footer">
		<p>© 2026 Andreas Steen Hofstad · IM1A · HTML-prosjekt</p>
	</footer>

	<script
		src="forum.js"
		onerror="var el=document.getElementById('ny-feil');if(el){el.textContent='Kunne ikke laste forum.js — den må ligge i SAMME mappe som denne html-fila (index.html, ny-trad.html, forum.js osv.).';el.hidden=false;}"></script>
	<script>
		document.addEventListener("DOMContentLoaded", function () {
			var skjema = document.getElementById("ny-trad-form");
			var feilBoks = document.getElementById("ny-feil");
			if (!skjema || !feilBoks) return;

			skjema.addEventListener("submit", function (e) {
				e.preventDefault();
				feilBoks.hidden = true;
				if (typeof ForumGreier === "undefined" || typeof ForumGreier.lagNyTrad !== "function") {
					feilBoks.textContent =
						"ForumGreier mangler — forum.js ble ikke kjørt. Last opp forum.js til samme mappe som html på serveren, eller åpne zip-mappa lokalt med alle filer sammen.";
					feilBoks.hidden = false;
					return;
				}
				try {
					var tittel = document.getElementById("tittel").value;
					var innlegg = document.getElementById("innlegg").value;
					var svar = ForumGreier.lagNyTrad(tittel, innlegg);
					if (svar.ok && svar.thread) {
						window.location.href = "trad.html?id=" + encodeURIComponent(svar.thread.id);
					} else {
						feilBoks.textContent = (svar && svar.msg) || "gikk ikke";
						feilBoks.hidden = false;
					}
				} catch (err) {
					feilBoks.textContent = "Feil: " + (err && err.message ? err.message : String(err));
					feilBoks.hidden = false;
				}
			});
		});
	</script>
</body>

</html>
