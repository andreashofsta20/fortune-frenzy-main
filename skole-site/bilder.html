		<h1>Galleri</h1>

		<div class="tekst-boks">
			<p>
				her brukte jeg <strong>grid</strong> så bildene radde seg fint. unsplash
				<a href="https://unsplash.com" target="_blank" rel="noopener noreferrer">her</a>. alt på bildene for

			</p>

					height="400"
					loading="lazy">

			</figure>
			<figure class="grid-item">
				<img
					src="https://images.unsplash.com/photo-1506905925346-21bda4d32df4?w=600&q=80"

					width="600"
					height="400"
					loading="lazy">
				<figcaption>fjell</figcaption>
			</figure>
			<figure class="grid-item">
				<img
					src="https://images.unsplash.com/photo-1516321318423-f06f85e504b3?w=600&q=80"
					alt="Hender som holder en smarttelefon"
					width="600"
					height="400"
