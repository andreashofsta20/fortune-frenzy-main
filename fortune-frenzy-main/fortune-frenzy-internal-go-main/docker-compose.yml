services:
  ff-api:
    build: .
    container_name: ff-api
    restart: unless-stopped
    ports:
      - "3004:3004"
    environment:
      - PORT=3004
    env_file:
      - .env
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://127.0.0.1:3004/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 90s
    networks:
      - ff-network

  mariadb:
    image: mariadb:11
    container_name: ff-mariadb
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
      MYSQL_DATABASE: Game1
      MYSQL_USER: ${MARIADB_USER}
      MYSQL_PASSWORD: ${MARIADB_PASSWORD}
    volumes:
      - mariadb-data:/var/lib/mysql
      - ./migrations:/docker-entrypoint-initdb.d
    ports:
      - "127.0.0.1:3306:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ff-network

  redis:
    image: redis:7-alpine
    container_name: ff-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD} --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ff-network

  caddy:
    image: caddy:2-alpine
    container_name: ff-caddy
    restart: unless-stopped
    # So Caddyfile `{$DOMAIN}` resolves (same .env as `ff-api`)
    env_file:
      - .env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy-data:/data
      - caddy-config:/config
      # Static site for skole.fortunefrenzy.xyz (create on host: mkdir -p /var/www/skole)
      - /var/www/skole:/srv/skole:ro
    depends_on:
      ff-api:
        condition: service_healthy
    networks:
      - ff-network

volumes:
  mariadb-data:
  redis-data:
  caddy-data:
  caddy-config:

networks:
  ff-network:
    driver: bridge
